<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f6f3ec">
<script>(function(){var t=null;try{t=localStorage.getItem("fb-theme")}catch(e){}if(t!=="dark"&&t!=="light")t=window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";var r=document.documentElement;r.setAttribute("data-theme",t);if(t==="dark")r.classList.add("is-dark")})()</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Fieldbook">
<title>Fieldbook</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f3ec;--panel:#fffdf8;--panel2:#f2eee4;--inp:#f2eee4;--line:#e3dccd;--txt:#1d1b16;--sub:#4a463d;--mut:#6b665a;--acc:#2f6f5e;--acc2:#2f6f5e;--onacc:#fffdf8;--clay:#a9743f;--red:#b4432f;--amb:#a86a12;--grn:#2c7a57;
 --hot:#e4efe9;--tint:#ece7db;--soft:#1d1b1612;--badbg:#f8e6e0;--badline:#e3b5a9;--glow:#2f6f5e33;--navbg:#f6f3ece8;--scrim:#1d1b1666;--shadow:0 1px 2px #1d1b160a,0 12px 32px -18px #1d1b1633;--blob1:#2f6f5e26;--blob2:#d9a87133;
 --ease:cubic-bezier(.2,.7,.2,1);--spring:cubic-bezier(.2,.7,.2,1);--mono:Roboto,system-ui,-apple-system,'Segoe UI',sans-serif;color-scheme:light}
[data-theme=dark]{--bg:#121311;--panel:#1a1b18;--panel2:#21231f;--inp:#21231f;--line:#30322c;--txt:#ecebe4;--sub:#c9c7bc;--mut:#a09e92;--acc:#7fc4ad;--acc2:#7fc4ad;--onacc:#121311;--clay:#d9a871;--red:#ef8a76;--amb:#e5b25d;--grn:#6fcf9f;
 --hot:#1f302a;--tint:#252722;--soft:#ecebe414;--badbg:#3a1e19;--badline:#6b3329;--glow:#7fc4ad40;--navbg:#121311e8;--scrim:#000000a6;--shadow:0 1px 2px #0006,0 14px 34px -18px #000c;--blob1:#7fc4ad1f;--blob2:#d9a8711a;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--txt);font:14px/1.45 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
h1,h2,h3,p{margin:0}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
.side{border-right:1px solid var(--line);background:var(--panel);position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:11px;padding:16px;border-bottom:1px solid var(--line)}
.logo{width:36px;height:36px;border-radius:10px;background:var(--acc);display:grid;place-items:center;flex:none;color:var(--onacc)}
.brand b{display:block;font-size:15px;line-height:1.2}
.brand small{font-size:12px;color:var(--mut)}
.nav{padding:12px;display:flex;flex-direction:column;gap:4px;flex:1}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:9px;color:var(--sub);font-weight:500}
.nav a:hover{background:var(--soft)}
.nav a.on{background:var(--acc);color:var(--onacc);font-weight:600}
.nav a em{margin-left:auto;font-style:normal;font-size:11px;background:var(--badbg);color:var(--red);border-radius:99px;padding:1px 8px;font-weight:600}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.who{border-top:1px solid var(--line);padding:12px 16px;display:flex;gap:10px;align-items:center}
.av{width:34px;height:34px;border-radius:50%;background:var(--hot);color:var(--acc2);display:grid;place-items:center;font-weight:600;flex:none;border:1px solid var(--acc)}
.who b{display:block;font-size:12.5px}
.who small{color:var(--mut);font-size:11px;display:flex;align-items:center;gap:6px}
.who small i{width:7px;height:7px;border-radius:50%;background:var(--grn)}
.who small.local i{background:var(--amb)}
main{min-width:0}
.top{display:flex;align-items:center;gap:10px;padding:12px 22px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:6;flex-wrap:wrap}
.top .tt{margin-right:auto;min-width:0}
.top h1{font-size:18px}
.top .tt small{color:var(--sub);font-size:12px}
.top .tt small code{font-family:var(--mono);color:var(--acc2);font-size:11.5px}
select,input,textarea{background:var(--inp);border:1px solid var(--line);border-radius:9px;padding:8px 10px;outline:none;min-width:0}
select:focus,input:focus,textarea:focus{border-color:var(--acc)}
input[type=range]{padding:0;border:0;background:none;accent-color:var(--acc)}
input[type=checkbox]{accent-color:var(--acc);width:16px;height:16px}
input[type=color]{padding:2px;height:36px}
#search{width:170px}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:8px 12px;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:hover{border-color:var(--mut)}
.btn:disabled{opacity:.35;cursor:default}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.btn.dan{color:var(--red)}
.btn.sm{padding:5px 9px;font-size:12.5px}
.btn.ic{padding:8px 9px}
.tabs{display:flex;gap:6px;padding:8px 22px;border-bottom:1px solid var(--line);overflow-x:auto;background:var(--panel2)}
.tab{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:9px;border:1px solid transparent;background:none;white-space:nowrap;font-weight:600;font-size:13px;color:var(--sub)}
.tab.on{background:var(--hot);border-color:var(--acc);color:var(--txt)}
.tab u{text-decoration:none;font-size:11px;background:var(--soft);border-radius:99px;padding:0 7px;font-family:var(--mono)}
.tab.on u{background:var(--acc);color:var(--onacc)}
.tab .pen{opacity:.5;border:0;background:none;padding:0 2px;display:grid}
.tab .pen:hover{opacity:1}.tab .pen svg{width:13px;height:13px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;flex:none}
#view{padding:18px 22px 40px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;min-width:0}
.card h2{font-size:15px;margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h2 .r{margin-left:auto;font-weight:500;font-size:12.5px;color:var(--mut);display:flex;gap:6px;align-items:center}
.card h2 a{color:var(--acc2)}
.eyebrow{font-family:var(--mono);font-size:13px;color:var(--acc2);margin-bottom:4px}
.lead h2{font-size:21px;display:block;margin-bottom:4px}
.lead p{color:var(--mut);font-size:13px}
.lead{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.lead>div:first-child{margin-right:auto}
.grid{display:grid;gap:14px}
.g5{grid-template-columns:repeat(5,1fr)}.g2{grid-template-columns:3fr 2fr}.g2e{grid-template-columns:1fr 1fr}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.kpi small{font-family:var(--mono);font-size:13px;color:var(--mut);display:block}
.kpi b{font-family:var(--mono);font-size:25px;display:block;margin:3px 0 1px}
.kpi span{color:var(--mut);font-size:12px}
.kpi.warn b{color:var(--red)}
.row{display:flex;gap:12px;align-items:flex-start;padding:10px 4px;border-top:1px solid var(--line);cursor:pointer}
.row:first-of-type{border-top:0}
.row:hover .rt{color:var(--acc2)}
.rmain{min-width:0;flex:1}
.rt{font-weight:600;overflow-wrap:anywhere}
.done .rt{text-decoration:line-through;color:var(--mut)}
.rd{color:var(--mut);font-size:12.5px;margin-top:2px;overflow-wrap:anywhere}
.rm{color:var(--mut);font-size:12.5px;margin-top:4px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.tag{display:inline-flex;align-items:center;font-size:11.5px;padding:1px 8px;border-radius:99px;border:1px solid color-mix(in srgb,var(--c) 45%,transparent);color:var(--c);background:color-mix(in srgb,var(--c) 10%,transparent)}
.late{color:var(--red);font-weight:600}
.chk{width:22px;height:22px;border-radius:50%;border:2px solid var(--mut);background:none;flex:none;margin-top:1px;display:grid;place-items:center;padding:0;font-size:12px;line-height:1}
.chk.on{border-color:var(--grn);background:var(--grn);color:var(--bg)}
.empty{color:var(--mut);text-align:center;padding:24px 10px;border:1px dashed var(--line);border-radius:10px}
.empty b{display:block;color:var(--txt);margin-bottom:2px}
/* calendar */
.calbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.calbar h3{font-size:16px;margin-right:auto}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--panel2)}
.seg button{border:0;background:none;padding:7px 10px;font-weight:600;font-size:12.5px;color:var(--mut)}
.seg button.on{background:var(--acc);color:var(--onacc)}
.holb.on{border-color:var(--amb);color:var(--amb)}
.metrics{font-family:var(--mono);font-size:12px;color:var(--mut);display:flex;gap:10px;justify-content:flex-end;margin-bottom:10px;flex-wrap:wrap}
.metrics b{color:var(--grn)}.metrics i{font-style:normal;color:var(--acc2)}
.calwrap{display:grid;grid-template-columns:1fr 300px;gap:14px;align-items:start}
.calwrap.nobl{grid-template-columns:1fr}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--line);gap:1px}
.dow{font-size:11px;color:var(--mut);text-align:center;padding:8px 0;font-family:var(--mono);background:var(--panel)}
.dow.we{color:var(--acc2)}
.cell{min-height:104px;background:var(--panel);padding:5px;display:flex;flex-direction:column;gap:3px;cursor:pointer;min-width:0}
.cell.out{background:var(--panel2)}.cell.out em{opacity:.4}
.cell.sel{box-shadow:inset 0 0 0 1.5px var(--acc)}
.cell.over{background:var(--hot)}
.ch{display:flex;align-items:center;justify-content:space-between}
.ch em{font-style:normal;font-family:var(--mono);font-size:12.5px;font-weight:600;width:24px;height:24px;display:grid;place-items:center;border-radius:50%}
.today .ch em{background:var(--acc);color:var(--onacc)}
.qa{border:0;background:none;color:var(--mut);padding:0 4px;font-size:16px;line-height:1;opacity:0}
.cell:hover .qa{opacity:1}
.chip{font-size:11px;padding:2px 6px;border-radius:6px;background:color-mix(in srgb,var(--c) 16%,transparent);border-left:3px solid var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:grab}
.chip.done{text-decoration:line-through;opacity:.6}
.hpill{font-size:10.5px;padding:1px 6px;border-radius:6px;border:1px solid color-mix(in srgb,var(--amb) 50%,transparent);color:var(--amb);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.more{font-size:10.5px;color:var(--mut)}
.yr{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.ym{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;cursor:pointer}
.ym b{font-size:13px;display:block;margin-bottom:6px}
.ym div{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;font-size:10px;font-family:var(--mono);text-align:center;color:var(--mut)}
.ym i{font-style:normal;padding:2px 0;border-radius:4px}
.ym i.has{background:var(--hot);color:var(--txt)}
.ym i.td{outline:1.5px solid var(--acc)}
.ym i.hd{color:var(--amb)}
/* backlog */
.bl h2 u{text-decoration:none;font-size:11px;background:var(--soft);border-radius:99px;padding:0 8px;font-family:var(--mono)}
.inl{display:flex;gap:8px;margin-bottom:8px}.inl input{flex:1}
.hint{color:var(--mut);font-size:11.5px;text-align:center;margin-top:10px}
/* charts */
.radar{display:block;width:100%;max-width:540px;margin:0 auto}
.radar text{fill:var(--sub);font-size:11px}
.radar .ring{fill:none;stroke:var(--line);stroke-dasharray:3 3}
.legend{display:flex;gap:6px 14px;flex-wrap:wrap;justify-content:center;font-size:12px;margin-top:8px;color:var(--sub)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;background:var(--c)}
.hb{display:grid;grid-template-columns:110px 1fr 40px;gap:8px;align-items:center;margin:9px 0;font-size:12.5px}
.hb div{height:12px;border-radius:6px;background:var(--soft);overflow:hidden}
.hb div i{display:block;height:100%;background:var(--c);border-radius:6px}
.hb b{text-align:right;font-family:var(--mono);font-weight:500}
.hb span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vb{display:flex;align-items:flex-end;gap:5px;height:150px}
.vb>div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;font-size:10px;color:var(--mut);font-family:var(--mono);min-width:0}
.vb .pair{display:flex;gap:2px;align-items:flex-end;height:100%;width:100%;justify-content:center}
.vb .pair i{width:45%;max-width:14px;border-radius:3px 3px 0 0;min-height:1px}
/* settings */
.set{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.set label,.f label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--mut);font-weight:600;min-width:0}
.ck{flex-direction:row!important;align-items:center;gap:8px!important;font-size:13px!important;color:var(--txt)!important;margin-top:10px}
.wsr{display:flex;align-items:center;gap:10px;padding:10px 2px;border-top:1px solid var(--line)}
.wsr:first-of-type{border-top:0}
.wsr>div{flex:1;min-width:0}.wsr small{color:var(--mut);display:block}
.themes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.themes button{text-align:left;border:1px solid var(--line);background:var(--panel2);border-radius:11px;padding:12px}
.themes button.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.themes small{display:block;color:var(--mut)}
/* modal */
.ov{position:fixed;inset:0;background:var(--scrim);z-index:20;display:none;align-items:flex-end;justify-content:center}
.ov.on{display:flex}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px 16px 0 0;width:100%;max-width:620px;max-height:94vh;overflow:auto;padding:18px}
.modal h3{font-size:17px}.modal>p{color:var(--mut);font-size:12.5px;margin:2px 0 14px}
.f{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.f label{grid-column:span 6}.f label.h{grid-column:span 3}.f label.t{grid-column:span 2}
.f textarea{min-height:70px;resize:vertical}
.box{grid-column:span 6;border:1px solid var(--line);border-radius:11px;padding:12px;background:var(--panel2)}
.box h4{margin:0 0 10px;font-size:12.5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.box h4 span{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.pr{display:grid;grid-template-columns:118px 1fr 44px 46px;gap:8px;align-items:center;margin:6px 0;font-size:12.5px}
.pr output{font-family:var(--mono);text-align:right}
.dur{margin-top:10px;font-size:12.5px;color:var(--sub);display:flex;gap:6px 14px;flex-wrap:wrap}
.dur b{font-family:var(--mono);color:var(--grn)}
.mact{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}.mact .sp{flex:1}
@media(min-width:700px){.ov{align-items:center;padding:20px}.modal{border-radius:16px}}
@media(max-width:900px){
 .app{grid-template-columns:1fr}
 .side{position:fixed;bottom:0;top:auto;left:0;right:0;height:auto;border-right:0;border-top:1px solid var(--line);z-index:10}
 .brand,.who{display:none}
 .nav{flex-direction:row;padding:5px 4px calc(5px + env(safe-area-inset-bottom));gap:0;justify-content:space-around}
 .nav a{flex-direction:column;gap:3px;font-size:9.5px;padding:6px 2px;flex:1;text-align:center;position:relative;min-width:0}
 .nav a em{position:absolute;top:2px;right:8px;margin:0;padding:0 5px;font-size:9px}
 .top{padding:10px 14px}.top .tt{width:100%}.top h1{font-size:16px}
 #search{flex:1;width:auto}
 .tabs{padding:8px 14px}
 #view{padding:14px 14px 96px}
 .g5{grid-template-columns:repeat(2,1fr)}.g2,.g2e,.calwrap,.set{grid-template-columns:1fr}
 .yr{grid-template-columns:repeat(2,1fr)}
 .cell{min-height:58px;padding:3px}
 .chip{font-size:0;padding:0;height:5px;border-left:0;background:var(--c);border-radius:3px;pointer-events:none}
 .hpill{font-size:0;padding:0;height:5px;border:0;background:var(--amb);border-radius:3px}
 .more,.qa{display:none}
 .pr{grid-template-columns:96px 1fr 40px 44px}
 .f label.t{grid-column:span 3}
 .msync{display:block!important}
}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--txt);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:13px;z-index:30;display:none;max-width:90vw;text-align:center}#toast.on{display:block}
.msync{display:none;font-size:11px;color:var(--mut);text-align:center;margin-top:6px}

/* ===== calm paper restyle + motion (matches Spending Tracker) ===== */
html{background:var(--bg)}
body{background:transparent;position:relative;font-family:Roboto,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14.5px;padding:env(safe-area-inset-top) 0 calc(84px + env(safe-area-inset-bottom));height:auto;min-height:100%}
h1,h2,h3,h4{font-weight:500}
.hide{display:none!important}
.app{display:block;max-width:1180px;margin:0 auto;min-height:0}
.top{background:none;border:0;position:static;padding:18px 16px 8px;gap:10px}
.top .tt{display:flex;align-items:center;gap:11px;flex:1;min-width:0;width:auto;margin-right:0}
.top .tt>div{min-width:0}
.top h1{font-size:22px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .tt small{display:block;font:400 13px Roboto,system-ui,sans-serif;color:var(--mut);margin-top:2px}
.top .tt small code{font:inherit;color:inherit}
.logo2{width:40px;height:40px;flex:none;border-radius:12px;box-shadow:var(--shadow)}
.tools{display:flex;gap:8px;width:100%;align-items:center}
.tools #search{flex:1;width:auto;border-radius:999px;background:var(--panel);padding:9px 14px}
@media(min-width:900px){.tools{width:auto;order:1}.tools #search{width:220px;flex:none}.themebtn{order:2}}
.themebtn{position:relative;flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--txt);overflow:hidden;box-shadow:var(--shadow);transition:transform .25s var(--spring),background .3s,border-color .3s;padding:0}
.themebtn:active{transform:scale(.9)}
.themebtn svg{position:absolute;inset:9px;width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .55s var(--spring),opacity .3s;pointer-events:none}
.themebtn .moon{opacity:0}
html.is-dark .themebtn .sun{opacity:0}
html.is-dark .themebtn .moon{transform:none;opacity:1}
html.theming,html.theming *,html.theming *::before,html.theming *::after{transition:background-color .45s ease,border-color .45s ease,color .45s ease,fill .45s ease,stroke .45s ease!important}
.tabs{background:none;border:0;padding:4px 16px 10px;gap:8px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 14px;color:var(--mut);font-weight:500;font-size:13.5px;transition:transform .2s var(--spring),background .25s,color .25s,border-color .25s}
.tab.on{background:var(--txt);border-color:var(--txt);color:var(--bg)}
.tab u{background:var(--soft)}
.tab.on u{background:var(--bg);color:var(--txt)}
#view{padding:4px 16px 30px}
.card,.kpi,.ym{border-radius:20px;box-shadow:var(--shadow)}
.card{padding:18px}
.card h2{font-size:18px}
.lead h2{font-size:22px}
.eyebrow{font-weight:500;color:var(--acc)}
.kpi{padding:16px;transition:transform .35s var(--spring),border-color .3s}
.kpi small{font-weight:500}
.kpi b{font-weight:500;font-size:28px;font-variant-numeric:tabular-nums}

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const p2=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());

const parse=s=>{const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const addMonths=(s,n)=>{const d=parse(s.slice(0,7)+'-01');d.setMonth(d.getMonth()+n);return iso(d)};
const diff=(a,b)=>Math.round((parse(a)-parse(b))/864e5);
const monday=s=>addDays(s,-((parse(s).getDay()+6)%7));
const uid=()=>Math.random().toString(36).slice(2,10);
const fmt=s=>parse(s).toLocaleDateString('en-GB',{day:'numeric',month:'short'});
const fmtLong=s=>parse(s).toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const dmy=s=>{const p=s.split('-');return p[2]+'/'+p[1]+'/'+p[0]};
const r1=x=>Math.round(x*10)/10;
const toMin=t=>{const p=(t||'0:0').split(':');return +p[0]*60+ +p[1]};
const fmt12=t=>{const m=toMin(t),h=Math.floor(m/60),mm=m%60;return((h+11)%12+1)+':'+p2(mm)+' '+(h<12?'AM':'PM')};
const PIL=[['L','Leadership','#a78bfa'],['C','Core Engineering','#38bdf8'],['I','Improvements','#34d399'],['S','Safety','#fbbf24'],['M','Management','#818cf8']];
const PM={};PIL.forEach(p=>PM[p[0]]=p);
const PRI={Low:'#64748b',Medium:'#38bdf8',High:'#f59e0b',Critical:'#f87171'};
const STC={Planned:'#38bdf8','In Progress':'#f59e0b','On Hold':'#94a3b8',Completed:'#34d399',Cancelled:'#f87171'};
const IC={calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',overview:'<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>',backlog:'<path d="M10 6h10M10 12h10M10 18h10"/><path d="M3.5 6l1 1 2-2M3.5 12l1 1 2-2M3.5 18l1 1 2-2"/>',analytics:'<path d="M4 20V4M4 20h17M9 16v-5M14 16V7M19 16v-3"/>',reports:'<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 17v-3M12 17v-6M15 17v-2"/>',config:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/>',trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/>',pen:'<path d="M4 20h4L19 9l-4-4L4 16z"/>'};
const ROUTES=['calendar','overview','backlog','analytics','reports','config','trash'];
const NAVL={calendar:['Calendar','Calendar'],overview:['Overview','Overview'],backlog:['Task backlog','Backlog'],analytics:['Analytics','Analytics'],reports:['PDF reports','Reports'],config:['Settings','Settings'],trash:['Trash','Trash']};
const TITLES={calendar:'Calendar',overview:'Overview',backlog:'Task backlog',analytics:'Analytics',reports:'Reports',config:'Settings',trash:'Trash'};
const FIXHOL={'01-01':'New Year’s Day','05-01':'Labour Day','08-31':'National Day','09-16':'Malaysia Day','12-25':'Christmas Day'};
const LS='engjournal.v2';

function blank(){return{v:2,updated:0,active:'all',
 settings:{name:'',theme:'dark',view:'month',holidays:true,pillar:'C',priority:'Medium',metric:'count',customHolidays:[{date:'2026-11-08',name:'Deepavali'}]},
 workspaces:[{id:'w1',name:'Furnace PCP',desc:'Furnace operations, maintenance and monitoring',color:'#f97316'},{id:'w2',name:'CVD',desc:'CVD engineering tasks, chambers and processes',color:'#3b82f6'},{id:'w3',name:'Civil Piping',desc:'Piping, utility lines, flow tests and inspections',color:'#10b981'},{id:'w4',name:'Special Project',desc:'Cross-functional initiatives, audits and expansions',color:'#8b5cf6'}],tasks:[]}}
const has=(o,k)=>typeof k==='string'&&Object.prototype.hasOwnProperty.call(o,k);
const S=(v,n)=>typeof v==='string'?v.replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g,'').slice(0,n):'';
const isDate=v=>typeof v==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(v)&&iso(parse(v))===v;
const isTime=v=>typeof v==='string'&&/^([01]\d|2[0-3]):[0-5]\d$/.test(v);
const isId=v=>typeof v==='string'&&/^[A-Za-z0-9_-]{1,24}$/.test(v);
const isCol=v=>typeof v==='string'&&/^#[0-9a-fA-F]{6}$/.test(v);
const clamp=(v,a,b)=>{v=Number(v);return isFinite(v)?Math.min(b,Math.max(a,Math.round(v))):a};
const oneOf=(v,list,d)=>list.includes(v)?v:d;
const MAXT=5000;
/* Every piece of data (device storage, account sync, pasted backups, form input) passes through here before it is shown. */
function normalize(o){const out=blank();if(!o||typeof o!=='object')return out;const seen=new Set(),fresh=id=>{while(!isId(id)||seen.has(id))id=uid();seen.add(id);return id};
 const ws=(Array.isArray(o.workspaces)?o.workspaces:[]).slice(0,50).filter(w=>w&&typeof w==='object').map(w=>({id:fresh(w.id),name:S(w.name,40).trim()||'Workspace',desc:S(w.desc,120),color:isCol(w.color)?w.color:'#38bdf8'}));
 if(ws.length)out.workspaces=ws;const ids=out.workspaces.map(w=>w.id);
 out.tasks=(Array.isArray(o.tasks)?o.tasks:[]).slice(0,MAXT).filter(t=>t&&typeof t==='object').map(t=>{const start=isDate(t.start)?t.start:'',end=start&&isDate(t.end)&&t.end>=start&&diff(t.end,start)<=366?t.end:start,pil={},src=t.pil&&typeof t.pil==='object'?t.pil:{};
  PIL.forEach(p=>{const v=has(src,p[0])?clamp(src[p[0]],0,100):0;if(v)pil[p[0]]=v});if(!Object.keys(pil).length)pil.C=100;
  return{id:fresh(t.id),created:clamp(t.created,0,4e12),title:S(t.title,160).trim()||'Untitled task',desc:S(t.desc,4000),ws:oneOf(t.ws,ids,ids[0]),priority:oneOf(t.priority,Object.keys(PRI),'Medium'),status:oneOf(t.status,Object.keys(STC),'Planned'),pil,allDay:t.allDay===true,start,end,st:isTime(t.st)?t.st:'08:30',ft:isTime(t.ft)?t.ft:'17:30',progress:clamp(t.progress,0,100),notes:S(t.notes,8000),deleted:t.deleted?clamp(t.deleted,1,4e12):null}});
 const s=o.settings&&typeof o.settings==='object'?o.settings:{},d=out.settings;
 out.settings={name:S(s.name,40),theme:oneOf(s.theme,['dark','light'],d.theme),view:oneOf(s.view,['year','month','week','day','agenda'],d.view),holidays:s.holidays!==false,pillar:oneOf(s.pillar,PIL.map(p=>p[0]),d.pillar),priority:oneOf(s.priority,Object.keys(PRI),d.priority),metric:oneOf(s.metric,['count','done','hours'],d.metric),
  customHolidays:Array.isArray(s.customHolidays)?s.customHolidays.slice(0,300).filter(h=>h&&isDate(h.date)&&S(h.name,40).trim()).map(h=>({date:h.date,name:S(h.name,40).trim()})):d.customHolidays};
 out.active=oneOf(o.active,ids,'all');out.updated=clamp(o.updated,0,4e12);return out}
let state=blank();
try{const s=localStorage.getItem(LS);if(s)state=normalize(JSON.parse(s))}catch(e){}
const ui={cur:today(),sel:today(),view:state.settings.view,bl:true,blq:'',blsort:'new',range:'year',q:'',rk:'week',rc:today()};

/* ---------- storage, undo ---------- */
let cloud=null,pushT=null,pushing=false,dirty=false,last=JSON.stringify(state),hist=[],fut=[];
function setSync(m){const t=m==='cloud'?'Synced to your account':m==='saving'?'Saving…':'Saved on this device';
 const el=$('#sync');el.className=m==='local'?'local':'';el.querySelector('span').textContent=t;$('#msync').textContent=t}
/* Restore merges: anything in the backup that this device doesn't have yet is added; tasks, workspaces and holidays already here stay exactly as they are. Settings are not touched. */
function mergeBackup(o){const inc=normalize(o),wsMap={},byName={};
 state.workspaces.forEach(w=>{wsMap[w.id]=w.id;byName[w.name.trim().toLowerCase()]=w.id});
 let nw=0;inc.workspaces.forEach(w=>{if(wsMap[w.id])return;const same=byName[w.name.trim().toLowerCase()];if(same){wsMap[w.id]=same;return}
  if(state.workspaces.length>=50){wsMap[w.id]=state.workspaces[0].id;return}state.workspaces.push(w);wsMap[w.id]=w.id;byName[w.name.trim().toLowerCase()]=w.id;nw++});
 const have=new Set(state.tasks.map(t=>t.id));let nt=0,kept=0;
 inc.tasks.forEach(t=>{if(have.has(t.id)){kept++;return}if(state.tasks.length>=MAXT)return;state.tasks.push(Object.assign({},t,{ws:wsMap[t.ws]||state.workspaces[0].id}));have.add(t.id);nt++});
 let nh=0;const hs=state.settings.customHolidays||(state.settings.customHolidays=[]),hd=new Set(hs.map(x=>x.date));
 (inc.settings.customHolidays||[]).forEach(x=>{if(!hd.has(x.date)){hs.push(x);hd.add(x.date);nh++}});
 const parts=[nt+' new task'+(nt===1?'':'s')];if(nw)parts.push(nw+' workspace'+(nw===1?'':'s'));if(nh)parts.push(nh+' holiday'+(nh===1?'':'s'));
 return 'Restore done: added '+parts.join(', ')+'. '+kept+' task'+(kept===1?'':'s')+' already here left unchanged.'}
function save(noHist){const prev=last;state.updated=Date.now();state=normalize(state);last=JSON.stringify(state);
 if(!noHist){hist.push(prev);if(hist.length>40)hist.shift();fut=[]}
 try{localStorage.setItem(LS,last)}catch(e){}
 if(cloud){dirty=true;clearTimeout(pushT);pushT=setTimeout(doPush,700)}render()}
function undo(){if(!hist.length)return;fut.push(last);state=normalize(JSON.parse(hist.pop()));save(true)}
function redo(){if(!fut.length)return;hist.push(last);state=normalize(JSON.parse(fut.pop()));save(true)}
async function doPush(){if(pushing||!dirty||!cloud)return;if(last.length>900000){dirty=false;setSync('local');return}pushing=true;dirty=false;setSync('saving');
 try{await cloud.set({json:JSON.stringify(state),updated:state.updated});setSync('cloud')}catch(e){setSync('local')}
 pushing=false;if(dirty)doPush()}
async function initCloud(){try{
 if(!window.claude||typeof window.claude.use!=='function')return;
 const r=await Promise.all([window.claude.use('db'),window.claude.use('user')]);const db=r[0],user=r[1];if(!db||!user)return;
 const id=await user.id();if(!id)return;
 if(!/^[A-Za-z0-9_.:-]{1,128}$/.test(String(id)))return;const ref=db.collection('data/users/'+id).doc('journal2');
 const snap=await ref.get();let d=snap;
 if(snap&&typeof snap.data==='function')d=snap.data();else if(snap&&snap.data&&typeof snap.data==='object'&&!snap.json)d=snap.data;
 cloud=ref;setSync('cloud');
 if(d&&typeof d.json==='string'&&d.json.length<3e6){const remote=normalize(JSON.parse(d.json));
  if(remote.updated>=state.updated){state=remote;last=JSON.stringify(state);hist=[];fut=[];ui.view=state.settings.view;try{localStorage.setItem(LS,last)}catch(e){}render()}else{dirty=true;doPush()}}
 else if(state.tasks.length){dirty=true;doPush()}
}catch(e){}}

/* ---------- task helpers ---------- */
const live=()=>state.tasks.filter(t=>!t.deleted);
const scoped=()=>live().filter(t=>state.active==='all'||t.ws===state.active);
const wsOf=id=>state.workspaces.find(w=>w.id===id);
const endOf=t=>t.end||t.start;
const onDay=(t,d)=>t.start&&t.start<=d&&endOf(t)>=d;
const inRange=(t,a,b)=>t.start&&t.start<=b&&endOf(t)>=a;
const isDone=t=>t.status==='Completed';
const isOpen=t=>t.status!=='Completed'&&t.status!=='Cancelled';
const isLate=t=>t.start&&isOpen(t)&&endOf(t)<today();
function perDay(st,ft,allDay){if(allDay)return 8;const a=toMin(st),b=toMin(ft);if(b<=a)return 0;const lunch=Math.max(0,Math.min(b,810)-Math.max(a,750));return(b-a-lunch)/60}
const hours=t=>t.start?r1(perDay(t.st,t.ft,t.allDay)*(diff(endOf(t),t.start)+1)):0;
const dom=t=>{let k='C',m=-1;PIL.forEach(p=>{const v=(t.pil||{})[p[0]]||0;if(v>m){m=v;k=p[0]}});return k};
const hol=d=>{if(!state.settings.holidays)return'';const c=state.settings.customHolidays.find(h=>h.date===d);return c?c.name:(FIXHOL[d.slice(5)]||'')};
const dayTasks=d=>scoped().filter(t=>onDay(t,d)).sort((a,b)=>(a.allDay?0:toMin(a.st))-(b.allDay?0:toMin(b.st)));
const icon=k=>'<svg class="i" viewBox="0 0 24 24">'+IC[k]+'</svg>';
const card=(h,body,right,cls)=>'<div class="card '+(cls||'')+'"><h2>'+h+(right?'<span class="r">'+right+'</span>':'')+'</h2>'+body+'</div>';
const empty=(a,b)=>'<div class="empty">'+(b?'<b>'+a+'</b>'+b:a)+'</div>';
const kpi=(l,v,s,w)=>'<div class="kpi '+(w?'warn':'')+'"><small>'+l+'</small><b>'+v+'</b><span>'+s+'</span></div>';

 else if(a==='copy-json')copy(JSON.stringify(state),'Backup copied — paste it somewhere safe.');
 else if(a==='restore-json'){const m=$('#bmsg');let r;try{const raw=$('#restoreTxt').value;if(raw.length>3e6)throw 0;const o=JSON.parse(raw);if(!o||typeof o!=='object'||!Array.isArray(o.tasks))throw 0;r=mergeBackup(o)}catch(x){m.textContent='That text is not a valid backup.';return}save();$('#restoreTxt').value='';$('#bmsg').textContent=r}
 else if(a==='m-close')closeForm();
 else if(a==='m-del'){if(onDel){onDel();closeForm();save()}}
 else if(a==='m-dup'){if(onDup){onDup();closeForm();save()}}
 else if(a==='preset'){const p=id.split(','),m=$('#modal');m.querySelector('[name=allDay]').checked=false;m.querySelector('[name=st]').value=p[0];m.querySelector('[name=ft]').value=p[1];formSync()}
 else if(a==='eq20'||a==='p100'||a==='balance'){const m=$('#modal'),els=PIL.map(p=>m.querySelector('[name=p_'+p[0]+']'));
  if(a==='eq20')els.forEach(x=>x.value=20);else if(a==='p100')els.forEach((x,i)=>x.value=PIL[i][0]===id?100:0);
  else{const sum=els.reduce((s,x)=>s+ +x.value,0);if(sum){let acc=0,big=els[0];els.forEach(x=>{x.value=Math.round(x.value/sum*20)*5;acc+= +x.value;if(+x.value>+big.value)big=x});big.value=+big.value+100-acc}}formSync()}
});
$('#ov').addEventListener('click',e=>{if(e.target===$('#ov'))closeForm()});
$('#modal').addEventListener('input',formSync);
$('#modal').addEventListener('submit',e=>{e.preventDefault();const d={};new FormData($('#modal')).forEach((v,k)=>{d[k]=typeof v==='string'?v.trim():v});const r=onSave?onSave(d):0;closeForm();if(r!==false)save()});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='search'){ui.q=t.value.trim();renderView()}else if(t.id==='blFilter'){ui.blq=t.value;const l=$('#blList');if(l)l.innerHTML=blList()}});
document.addEventListener('change',e=>{const t=e.target;
 if(t.id==='yearSel'){ui.cur=t.value+ui.cur.slice(4);renderView()}
 else if(t.id==='blSort'){ui.blsort=t.value;renderView()}
 else if(t.id==='metricSel'){state.settings.metric=t.value;save(true)}
 else if(t.dataset&&t.dataset.set){const k=t.dataset.set;state.settings[k]=t.type==='checkbox'?t.checked:t.value.trim();if(k==='view')ui.view=t.value;save(true)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeForm();
 else if(e.key==='Enter'&&e.target.id==='blQuick'){e.preventDefault();blAdd()}
 else if((e.ctrlKey||e.metaKey)&&!/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)){if(e.key==='z'){e.preventDefault();undo()}else if(e.key==='y'){e.preventDefault();redo()}}});
/* drag & drop (desktop) */
document.addEventListener('dragstart',e=>{const el=e.target.closest&&e.target.closest('[data-drag]');if(el&&e.dataTransfer){e.dataTransfer.setData('text/plain',el.dataset.drag);e.dataTransfer.effectAllowed='move'}});
document.addEventListener('dragover',e=>{const el=e.target.closest&&e.target.closest('[data-drop]');if(el){e.preventDefault();el.classList.add('over')}});
document.addEventListener('dragleave',e=>{const el=e.target.closest&&e.target.closest('[data-drop]');if(el&&!el.contains(e.relatedTarget))el.classList.remove('over')});
document.addEventListener('drop',e=>{const el=e.target.closest&&e.target.closest('[data-drop]');if(!el)return;e.preventDefault();el.classList.remove('over');
 const t=state.tasks.find(x=>x.id===e.dataTransfer.getData('text/plain')),d=el.dataset.drop;if(!t)return;
 if(!d){if(!t.start)return;t.start='';t.end=''}else{if(t.start===d)return;const len=t.start?diff(endOf(t),t.start):0;t.start=d;t.end=addDays(d,len)}save()});
window.addEventListener('hashchange',()=>{ui.q='';$('#search').value='';render();window.scrollTo(0,0)});
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(!$('#ov').classList.contains('on'))render()},200)});

/* ---------- push reminders (installed app on your own hosting) ---------- */
const RM={sub:null,busy:false,msg:'',state:'unknown'};
const rmQuiet=()=>{try{const q=JSON.parse(localStorage.getItem('fb-quiet')||'null');if(q)return q}catch(e){}return{on:true,start:22,end:7}};
const rmStandalone=()=>!!((window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone);
const rmIOS=()=>/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
function rmWhy(){if(window.claude||window.top!==window)return'Reminders work in your installed copy of Fieldbook (the Netlify address), not inside Claude.';
 if(!('serviceWorker' in navigator)||!('PushManager' in window)||!('Notification' in window))return rmIOS()&&!rmStandalone()?'On iPhone, first add Fieldbook to your Home Screen (Share › Add to Home Screen), then open it from the icon and turn reminders on here.':'This browser does not support push notifications.';
 if(Notification.permission==='denied')return'Notifications are blocked for Fieldbook. Allow them in your phone’s Settings › Notifications, then come back.';return''}
async function rmRefresh(){if(rmWhy()){RM.state='na';return}try{const r=await navigator.serviceWorker.ready;RM.sub=await r.pushManager.getSubscription();RM.state=RM.sub?'on':'off'}catch(e){RM.state='off'}}
function remindCard(){const q=rmQuiet(),why=rmWhy(),hrs=[...Array(24).keys()].map(h=>[h,String(h).padStart(2,'0')+':00']),hs=(id,v)=>'<select id="'+id+'">'+hrs.map(o=>'<option value="'+o[0]+'"'+(o[0]===v?' selected':'')+'>'+o[1]+'</option>').join('')+'</select>';
 return'<p style="color:var(--mut);font-size:12.5px;margin-bottom:10px">A notification every 4 hours (08:00, 12:00, 16:00, 20:00, 00:00 and 04:00 Malaysia time) reminds you to log your tasks.</p>'
 +(why?'<div class="empty" style="text-align:left">'+esc(why)+'</div>':
  '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><button class="btn '+(RM.state==='on'?'':'pri')+'" data-act="rm-toggle"'+(RM.busy?' disabled':'')+'>'+(RM.state==='on'?'Turn reminders off':'Turn reminders on')+'</button>'+(RM.state==='on'?'<button class="btn" data-act="rm-test"'+(RM.busy?' disabled':'')+'>Send a test now</button>':'')+'<span class="tag" style="--c:'+(RM.state==='on'?'var(--grn)':'var(--mut)')+'">'+(RM.state==='on'?'On for this device':RM.state==='off'?'Off':'Checking…')+'</span></div>'
  +'<label class="ck"><input type="checkbox" id="rmQuietOn"'+(q.on?' checked':'')+'>Quiet hours: no reminders between</label><div class="set" style="margin-top:6px"><label>From'+hs('rmFrom',q.start)+'</label><label>Until'+hs('rmTo',q.end)+'</label></div>')
 +'<div id="rmMsg" style="color:var(--mut);font-size:12.5px;margin-top:8px">'+esc(RM.msg)+'</div>'}
const b64u=s=>{const p='='.repeat((4-s.length%4)%4),b=atob((s+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(b,c=>c.charCodeAt(0))};
/* the app is served from GitHub Pages; the reminder API still runs as Netlify functions */
const API=/\.netlify\.app$/.test(location.hostname)?'':'https://fieldbook-azhar.netlify.app';
async function rmApi(path,method,body){const r=await fetch(API+path,{method,headers:{'content-type':'application/json'},body:body?JSON.stringify(body):undefined});let j={};try{j=await r.json()}catch(e){}if(!r.ok)throw new Error(j.error||('Server error '+r.status));return j}
async function rmSave(){if(!RM.sub)return;await rmApi('/api/push','POST',{subscription:RM.sub.toJSON(),quiet:rmQuiet(),tz:Intl.DateTimeFormat().resolvedOptions().timeZone})}
async function rmToggle(){RM.busy=true;RM.msg='';renderView();try{
 if(RM.state==='on'){const ep=RM.sub.endpoint;await RM.sub.unsubscribe().catch(()=>{});await rmApi('/api/push','DELETE',{endpoint:ep}).catch(()=>{});RM.sub=null;RM.state='off';RM.msg='Reminders are off for this device.'}
 else{const perm=await Notification.requestPermission();if(perm!=='granted')throw new Error('Notification permission was not given.');
  const {key}=await rmApi('/api/push/key','GET');const r=await navigator.serviceWorker.ready;
  RM.sub=await r.pushManager.getSubscription()||await r.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(key)});
  await rmSave();RM.state='on';RM.msg='Reminders are on. Tap “Send a test now” to check.'}
}catch(e){RM.msg=e.message||'Could not change reminders.'}RM.busy=false;renderView()}
async function rmTest(){RM.busy=true;RM.msg='Sending…';renderView();try{await rmApi('/api/push/test','POST',{endpoint:RM.sub.endpoint});RM.msg='Test sent. It should arrive in a few seconds.'}catch(e){RM.msg=e.message}RM.busy=false;renderView()}
document.addEventListener('change',e=>{const id=e.target.id;if(id==='rmQuietOn'||id==='rmFrom'||id==='rmTo'){const q={on:$('#rmQuietOn').checked,start:+$('#rmFrom').value,end:+$('#rmTo').value};try{localStorage.setItem('fb-quiet',JSON.stringify(q))}catch(x){}
 if(RM.state==='on')rmSave().then(()=>{RM.msg='Quiet hours saved.';const m=$('#rmMsg');if(m)m.textContent=RM.msg}).catch(x=>{const m=$('#rmMsg');if(m)m.textContent=x.message})}});
rmRefresh().then(()=>{if(route()==='config'&&!$('#ov').classList.contains('on'))renderView()});
setSync('local');render();initCloud();
try{if(!window.claude&&window.top===window&&'serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1'))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
</script>
